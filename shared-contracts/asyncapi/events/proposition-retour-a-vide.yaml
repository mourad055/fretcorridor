asyncapi: 2.6.0
info:
  title: PropositionRetourAVide
  version: 1.0.0
  description: |
    EF-MAT-08 / RG-058 (CDC S8.6, Sprint 12). Publie par OPT (Moteur) quand
    une Tournee passe a TERMINEE (toutes les etapes EXECUTEE) - jamais avant,
    conformement a RG-058 : "aucune mission de retour n'est confirmee avant
    la livraison effective de l'aller."

    Porteur : Personne 3 (Moteur). Consommateur : Mobile (app
    Chauffeur/Transporteur, ecran "notification de mission retour,
    acceptation/refus" - Plan d'execution S12).

channels:
  proposition-retour-a-vide:
    publish:
      message:
        $ref: '#/components/messages/PropositionRetourAVideEvent'

components:
  messages:
    PropositionRetourAVideEvent:
      payload:
        type: object
        required:
          - eventId
          - tourneeId
          - capaciteId
          - pointDepartLatitude
          - pointDepartLongitude
          - dateGeneration
        properties:
          eventId:
            type: string
            format: uuid
          tourneeId:
            type: string
            format: uuid
          capaciteId:
            type: string
            format: uuid
          axeId:
            type: string
            format: uuid
            nullable: true
          pointDepartLatitude:
            type: number
            format: double
            description: Destination de la derniere livraison de la tournee terminee - point de depart reel du vehicule.
          pointDepartLongitude:
            type: number
            format: double
          dateGeneration:
            type: string
            format: date-time
