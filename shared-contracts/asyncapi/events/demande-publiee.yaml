asyncapi: '2.6.0'
info:
  title: DemandePubliee
  version: 0.1.0-draft
  description: >
    BROUILLON, redige cote Moteur (Personne 3) en l'absence de contrat existant
    dans shared-contracts/. A VALIDER avec Personne 1 (Mobile, porteur de
    service-mkt, qui publiera cet evenement) au point de synchronisation
    hebdomadaire des contrats d'API (cf Feuille de route S5.1) avant toute
    implementation cote MKT. Ne pas considerer ce contrat comme fige.
channels:
  demande-publiee:
    publish:
      summary: Nouvelle demande de transport publiee par un chargeur (module MKT, Mobile)
      message:
        $ref: '#/components/messages/DemandePubliee'
components:
  messages:
    DemandePubliee:
      name: DemandePubliee
      title: Demande publiee
      contentType: application/json
      payload:
        $ref: '#/components/schemas/DemandePublieePayload'
  schemas:
    DemandePublieePayload:
      type: object
      required:
        - eventId
        - demandeId
        - axeId
        - valeursCriteres
      properties:
        eventId:
          type: string
          format: uuid
          description: Cle d'idempotence - evite les doublons en file d'attente cote OPT (opt.demande_en_attente).
        demandeId:
          type: string
          format: uuid
        axeId:
          type: string
          format: uuid
          description: Determine sur quel cycle de matching (par axe actif) cette demande sera evaluee.
        valeursCriteres:
          type: object
          additionalProperties:
            type: number
          description: Memes conventions que CapaciteDeclaree.valeursCriteres (voir capacite-declaree.yaml).
        origine:
          type: object
          nullable: true
          properties:
            latitude: { type: number, format: double }
            longitude: { type: number, format: double }
        destination:
          type: object
          nullable: true
          properties:
            latitude: { type: number, format: double }
            longitude: { type: number, format: double }
          description: >
            Devient origineLatitude/destinationLatitude de opt.affectation une
            fois l'affectation confirmee - c'est cette donnee que TRK recupere
            ensuite via ServiceOptClient pour calculer son ETA reel.
        poidsTaxableKg:
          type: number
          nullable: true
          description: >
            POIDS TAXABLE = max(poids reel, volume x rho, LDM x lambda) (RG-100/RG-101,
            regle du maximum deja appliquee en amont, cote service-mkt/service-cap,
            EF-CAP-01/02) - c'est DONC le poids VOLUMETRIQUE inclus, transmis brut,
            jamais recalcule cote Moteur. C'est cette valeur (poids + distance) que
            TarificationL4Service (service-opt) utilise pour son COUT_VARIABLE
            (plan de reorientation partie Client point 3.1 / CDC S8.9).
        fenetreDebut:
          type: string
          format: date-time
          nullable: true
          description: >
            EF-MAT-06/RG-107 (Phase 2, Sprint 11) - fenetre temporelle SOUPLE
            (jamais dure, cf CDC S8.6.1 point 4) de collecte/livraison
            souhaitee. Absent = pas de penalite de retard appliquee ce cycle
            (mode permissif, meme principe que rayonAppariementKm).
        fenetreFin:
          type: string
          format: date-time
          nullable: true
          description: Borne haute de la fenetre - voir fenetreDebut.
