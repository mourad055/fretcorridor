openapi: 3.0.3
info:
  title: FretCorridor — Gateway — Dashboard KYC Admin
  version: "1.0.0"
  description: >
    FE-ADM-06 (Sprint 2) : file de vérification KYC en attente et décision
    (validé/rejeté), journalisée nominativement (ENF-SEC-02). Consomme
    aujourd'hui un adaptateur mock côté gateway, en attendant service-ida
    (Mobile) — TODO(mobile).
servers:
  - url: http://localhost:8082

paths:
  /api/v1/admin/kyc/pending:
    get:
      operationId: listPendingKyc
      summary: Liste les dossiers KYC en attente de décision
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Liste des dossiers en attente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KycDossier'
        '401':
          description: Non authentifié
        '403':
          description: Rôle insuffisant (réservé au rôle ADMIN)

  /api/v1/admin/kyc/{dossierId}/decision:
    post:
      operationId: decideKyc
      summary: Valide ou rejette un dossier KYC
      security:
        - bearerAuth: []
      parameters:
        - name: dossierId
          in: path
          required: true
          schema:
            type: string
        - name: X-Idempotency-Key
          in: header
          required: true
          description: Obligatoire sur toute mutation (PRD §7.3) ; une clé rejouée renvoie le résultat déjà appliqué sans le réappliquer.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [VALIDE, REJETE]
      responses:
        '200':
          description: Décision appliquée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KycDossier'
        '400':
          description: Décision invalide ou en-tête X-Idempotency-Key manquant (RFC 7807)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Non authentifié
        '403':
          description: Rôle insuffisant
        '404':
          description: Dossier introuvable (RFC 7807)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    KycDossier:
      type: object
      required: [id, acteurNom, acteurTelephone, typeActeur, soumisLe, statut]
      properties:
        id:
          type: string
        acteurNom:
          type: string
        acteurTelephone:
          type: string
        typeActeur:
          type: string
          enum: [CHAUFFEUR, TRANSPORTEUR_PERSONNE_MORALE]
        soumisLe:
          type: string
          format: date-time
        statut:
          type: string
          enum: [EN_ATTENTE, VALIDE, REJETE]

    ProblemDetail:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
