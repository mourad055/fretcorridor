openapi: 3.0.3
info:
  title: FretCorridor — Gateway — Paiement (lecture seule)
  version: "1.0.0"
  description: >
    Sprint 8 : solde/historique Transporteur (FE-TRP-03) et rapport financier
    Bureau/Admin, lecture seule, adossés au service-pay réel (pas un mock —
    seul le prestataire de paiement externe est simulé, PRD §1.3).
servers:
  - url: http://localhost:8082

paths:
  /api/v1/transporteur/paiement:
    get:
      operationId: soldeTransporteur
      summary: Solde et historique de l'acteur Transporteur authentifié
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Solde et historique
          content:
            application/json:
              schema:
                type: object
                required: [solde, historique]
                properties:
                  solde: { type: number }
                  historique:
                    type: array
                    items:
                      $ref: '#/components/schemas/Ecriture'
        '403':
          description: Rôle insuffisant (réservé au rôle TRANSPORTEUR)

  /api/v1/bureau/rapport-financier:
    get:
      operationId: rapportFinancierBureau
      summary: Rapport financier du tenant de l'acteur Bureau authentifié
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Écritures du tenant
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ecriture'
        '403':
          description: Rôle insuffisant (réservé au rôle BUREAU)

  /api/v1/admin/rapport-financier/{tenantId}:
    get:
      operationId: rapportFinancierAdmin
      summary: Rapport financier d'un tenant, consultation transverse par un Admin (journalisée, ENF-SEC-02)
      security:
        - bearerAuth: []
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Écritures du tenant
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ecriture'
        '403':
          description: Rôle insuffisant (réservé au rôle ADMIN)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Ecriture:
      type: object
      required: [id, missionId, typeCompte, nature, sens, montant, creeLe, statut]
      properties:
        id: { type: string }
        missionId: { type: string }
        typeCompte: { type: string }
        nature: { type: string }
        sens: { type: string }
        montant: { type: number }
        creeLe: { type: string, format: date-time }
        statut: { type: string }
