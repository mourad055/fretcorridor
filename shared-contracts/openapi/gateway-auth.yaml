openapi: 3.0.3
info:
  title: FretCorridor — Gateway — Authentification
  version: "1.0.0"
  description: >
    FE-WEB-01 : écran de connexion unique (téléphone + code), aucune indication de
    rôle avant authentification réussie. Le rôle et le tenant sont résolus depuis le
    JWT émis par cet endpoint (RG-002).
servers:
  - url: http://localhost:8080

paths:
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Authentifie un acteur par téléphone + code à usage unique
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentification réussie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Requête invalide (RFC 7807)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Téléphone ou code invalide (RFC 7807)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v1/bureau/ping:
    get:
      operationId: bureauPing
      summary: Endpoint de démonstration RBAC — rôle Bureau uniquement (Sprint 1)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Accès autorisé
        '401':
          description: Non authentifié
        '403':
          description: Rôle insuffisant

  /api/v1/transporteur/ping:
    get:
      operationId: transporteurPing
      summary: Endpoint de démonstration RBAC — rôle Transporteur uniquement (Sprint 1)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Accès autorisé
        '401':
          description: Non authentifié
        '403':
          description: Rôle insuffisant

  /api/v1/admin/ping:
    get:
      operationId: adminPing
      summary: Endpoint de démonstration RBAC — rôle Administration uniquement (Sprint 1)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Accès autorisé
        '401':
          description: Non authentifié
        '403':
          description: Rôle insuffisant

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginRequest:
      type: object
      required: [phone, code]
      properties:
        phone:
          type: string
          example: "+237600000001"
        code:
          type: string
          example: "123456"

    LoginResponse:
      type: object
      required: [token, role, tenantId]
      properties:
        token:
          type: string
          description: JWT contenant les claims role et tenantId
        role:
          type: string
          enum: [BUREAU, TRANSPORTEUR, ADMIN]
        tenantId:
          type: string

    ProblemDetail:
      type: object
      description: Format RFC 7807
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
