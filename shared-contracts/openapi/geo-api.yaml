openapi: 3.0.3
info:
  title: FretCorridor - Service Géospatial (GEO)
  description: |
    Référentiel géospatial : axes, hubs, zonage H3 (EF-GEO-01/02/03).

    Réécrit intégralement le 07/08/2026 : la version précédente de ce contrat
    utilisait un identifiant "code" et un mécanisme de bascule d'état par
    lot qui n'ont jamais existé dans le code réel (AxeController/HubController).
    Ce contrat est désormais généré à partir des DTOs Java existants, pas
    l'inverse.
  version: 1.1.0
servers:
  - url: http://localhost:8084
    description: Service GEO local (hors Docker)
paths:
  # =========================================================================
  # AXES
  # =========================================================================
  /api/geo/axes:
    get:
      operationId: listerAxes
      summary: Liste les axes, filtres par tenant si precise
      description: |
        ENF-MUL-01 (corrige le 2026-08-09, suite audit gateway) : si tenantId
        est fourni, le filtrage est fait ICI en base (jamais par un appelant
        a posteriori). Sans tenantId (retro-compatibilite OPT, appel interne
        synchrone sans notion de tenant), retourne tous les axes.
      tags: [Axes]
      parameters:
        - name: tenantId
          in: query
          required: false
          schema: { type: string, maxLength: 100 }
          description: Si absent, retourne tous les axes (usage interne OPT/filtre L0)
      responses:
        '200':
          description: Liste des axes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AxeResponse'
    post:
      operationId: creerAxe
      summary: Crée un nouvel axe
      description: |
        Crée un axe reliant deux hubs existants et distincts.
        visibiliteActive/matchingActif/paiementActif sont optionnels ;
        s'ils sont omis, l'axe est créé désactivé sur les trois états
        (défaut false, EF-GEO-03).
      tags: [Axes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AxeCreationRequest'
      responses:
        '201':
          description: Axe créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AxeResponse'
        '400':
          description: Hubs identiques, ou l'un des deux hubs est introuvable

  /api/geo/axes/{id}:
    get:
      operationId: obtenirAxe
      summary: Consulte un axe par ID
      tags: [Axes]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Axe trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AxeResponse'
        '404':
          description: Axe introuvable

  /api/geo/axes/actifs-matching:
    get:
      operationId: listerAxesActifsPourMatching
      summary: Liste les axes où le matching est activé
      description: |
        Consommé par OPT (MatchingCycleService, synchrone interne) pour
        savoir sur quels axes lancer un cycle. Seuls les axes avec
        matchingActif=true sont retournés (EF-GEO-03, "jamais globalement
        par défaut").
      tags: [Axes]
      responses:
        '200':
          description: Liste des axes actifs pour le matching
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AxeResponse'

  /api/geo/axes/{id}/etats/{etat}:
    patch:
      operationId: basculerEtat
      summary: Active/désactive UN état indépendamment des deux autres
      description: |
        Bascule un seul des trois états d'activation à la fois (EF-GEO-03) —
        ce n'est PAS un endpoint qui accepte les trois états en une requête.
        "etat" doit valoir visibilite, matching ou paiement.
      tags: [Axes]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: etat
          in: path
          required: true
          schema:
            type: string
            enum: [visibilite, matching, paiement]
        - name: actif
          in: query
          required: true
          schema: { type: boolean }
      responses:
        '200':
          description: État basculé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AxeResponse'
        '400':
          description: Valeur d'état inconnue
        '404':
          description: Axe introuvable

  # =========================================================================
  # HUBS
  # =========================================================================
  /api/geo/hubs:
    get:
      operationId: listerHubs
      summary: Liste tous les hubs
      tags: [Hubs]
      responses:
        '200':
          description: Liste des hubs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HubResponse'
    post:
      operationId: creerHub
      summary: Crée un nouveau hub
      description: L'index H3 est calculé automatiquement à la création (résolution configurée en base, jamais codée en dur).
      tags: [Hubs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HubCreationRequest'
      responses:
        '201':
          description: Hub créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HubResponse'

  /api/geo/hubs/{id}:
    get:
      operationId: consulterHub
      summary: Consulte un hub par ID
      tags: [Hubs]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Hub trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HubResponse'
        '404':
          description: Hub introuvable

  # =========================================================================
  # ZONAGE H3
  # =========================================================================
  /api/geo/zonage/index:
    get:
      operationId: indexPourPoint
      summary: Calcule l'index H3 d'un point
      tags: [Zonage H3]
      parameters:
        - name: latitude
          in: query
          required: true
          schema: { type: number, format: double }
        - name: longitude
          in: query
          required: true
          schema: { type: number, format: double }
      responses:
        '200':
          description: Index H3
          content:
            text/plain:
              schema: { type: string, example: "881fa34c9fffff" }

  /api/geo/zonage/k-ring:
    get:
      operationId: kRing
      summary: Cellules H3 voisines (k-ring), sans jointure aux hubs
      description: Utilisé principalement pour le debug/vérification manuelle du zonage.
      tags: [Zonage H3]
      parameters:
        - name: indexH3
          in: query
          required: true
          schema: { type: string }
        - name: k
          in: query
          required: false
          schema: { type: integer, default: 1 }
      responses:
        '200':
          description: Liste des index H3
          content:
            application/json:
              schema:
                type: array
                items: { type: string }

  /api/geo/zonage/hubs-proches:
    get:
      operationId: hubsProches
      summary: Hubs proches d'un point (endpoint métier principal, filtre L0)
      description: |
        Retourne tous les hubs dans la cellule H3 du point donné et ses k
        anneaux voisins. Réduit l'espace de recherche avant l'affectation
        Kuhn-Munkres (L1). Budget de latence ~50 ms (appel synchrone interne,
        consommé par OPT).
      tags: [Zonage H3]
      parameters:
        - name: latitude
          in: query
          required: true
          schema: { type: number, format: double }
        - name: longitude
          in: query
          required: true
          schema: { type: number, format: double }
        - name: k
          in: query
          required: false
          schema: { type: integer, default: 1 }
      responses:
        '200':
          description: Hubs trouvés dans la zone
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HubResponse'

components:
  schemas:
    AxeCreationRequest:
      type: object
      required: [nom, hubOrigineId, hubDestinationId]
      properties:
        nom: { type: string, maxLength: 150, example: "Douala-Yaoundé" }
        hubOrigineId: { type: string, format: uuid }
        hubDestinationId: { type: string, format: uuid }
        visibiliteActive: { type: boolean, nullable: true, description: "Défaut false si omis" }
        matchingActif: { type: boolean, nullable: true, description: "Défaut false si omis" }
        paiementActif: { type: boolean, nullable: true, description: "Défaut false si omis" }
        parametres:
          type: object
          additionalProperties: true
          description: JSONB libre (EF-GEO-02) — ex. fenetreMatchingMs, rayonAppariementKm
        tenantId:
          type: string
          maxLength: 100
          nullable: true
          description: "Optionnel. Si absent, le tenant BGFT (Phase 1 par defaut) est applique.

    AxeResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        nom: { type: string }
        hubOrigineId: { type: string, format: uuid }
        hubOrigineNom: { type: string }
        hubDestinationId: { type: string, format: uuid }
        hubDestinationNom: { type: string }
        visibiliteActive: { type: boolean }
        matchingActif: { type: boolean }
        paiementActif: { type: boolean }
        parametres:
          type: object
          additionalProperties: true
        tenantId:
          type: string
          maxLength: 100
          nullable: true
          description: |
            ENF-MUL-01. String depuis la migration V8 (plus jamais UUID,
            PR #126). Nullable pour les donnees anterieures a la migration
            V4 (pre-remplies avec le tenant BGFT par defaut en pratique).
        dateCreation: { type: string, format: date-time }

    HubCreationRequest:
      type: object
      required: [nom, ville, typeHub, latitude, longitude]
      properties:
        nom: { type: string, minLength: 2, maxLength: 150, example: "Plateforme logistique de Douala" }
        ville: { type: string, minLength: 2, maxLength: 150, example: "Douala" }
        typeHub: { $ref: '#/components/schemas/TypeHub' }
        latitude: { type: number, format: double, minimum: -90, maximum: 90 }
        longitude: { type: number, format: double, minimum: -180, maximum: 180 }

    HubResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        nom: { type: string }
        ville: { type: string }
        typeHub: { $ref: '#/components/schemas/TypeHub' }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        h3Index:
          type: string
          nullable: true
          description: Calculé une seule fois à la création, jamais recalculé ensuite
        dateCreation: { type: string, format: date-time }

    TypeHub:
      type: string
      enum: [VILLE, PLATEFORME, POINT_CONSOLIDATION]
      description: |
        VILLE = granularité large (Phase 1) ; PLATEFORME = entrepôt/cour de
        transit ; POINT_CONSOLIDATION = regroupement LTL (Phase 2+).
