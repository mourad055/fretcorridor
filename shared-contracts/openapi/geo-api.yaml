openapi: 3.0.3
info:
  title: FretCorridor - Service Géospatial (GEO)
  description: Référentiel géospatial : axes, hubs, zonage H3.
  version: 1.0.0
servers:
  - url: http://localhost:8085
    description: Service GEO local
paths:
  /api/geo/axes:
    get:
      summary: Liste des axes
      operationId: getAxes
      responses:
        '200':
          description: Liste des axes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AxeResponse'
  /api/geo/axes/{code}:
    get:
      summary: Détail d'un axe
      operationId: getAxeByCode
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Axe trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AxeResponse'
        '404':
          description: Axe introuvable
    patch:
      summary: Mise à jour des états d'activation
      operationId: updateActivationStates
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                visibiliteActive: { type: boolean }
                matchingActif: { type: boolean }
                paiementActif: { type: boolean }
      responses:
        '200':
          description: États mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AxeResponse'
  /api/geo/hubs:
    get:
      summary: Liste des hubs
      operationId: getHubs
      responses:
        '200':
          description: Liste des hubs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HubResponse'
    post:
      summary: Créer un hub
      operationId: createHub
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HubCreationRequest'
      responses:
        '201':
          description: Hub créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HubResponse'
  /api/geo/zonage/hubs-proches:
    get:
      summary: Hubs autour d'un point (filtrage L0)
      operationId: getHubsProches
      parameters:
        - name: latitude
          in: query
          required: true
          schema: { type: number, format: double }
        - name: longitude
          in: query
          required: true
          schema: { type: number, format: double }
        - name: k
          in: query
          required: false
          schema: { type: integer, default: 1 }
      responses:
        '200':
          description: Liste des hubs proches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HubProcheDto'
components:
  schemas:
    AxeResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        nom: { type: string }
        visibiliteActive: { type: boolean }
        matchingActif: { type: boolean }
        paiementActif: { type: boolean }
        fenetreMatchingMs: { type: integer }
        rayonAppariementKm: { type: integer }
        surcoucheSecuritaire: { type: string, nullable: true }
        hubs:
          type: array
          items: { $ref: '#/components/schemas/HubResponse' }
    HubResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        nom: { type: string }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        type: { type: string, enum: [VILLE, PLATEFORME, POINT_CONSOLIDATION] }
    HubCreationRequest:
      type: object
      required: [code, nom, latitude, longitude, type]
      properties:
        code: { type: string }
        nom: { type: string }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        type: { type: string, enum: [VILLE, PLATEFORME, POINT_CONSOLIDATION] }
    HubProcheDto:
      type: object
      properties:
        hub: { $ref: '#/components/schemas/HubResponse' }
        distanceKm: { type: number, format: double }
