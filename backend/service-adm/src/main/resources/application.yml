server:
  # 8085 est déjà pris par service-opt (interne Docker) — collision fragile
  # (sans conséquence tant que les deux tournent avec des port mappings hôte
  # distincts, mais casse dès qu'on les lance sans compose séparé, ex. deux
  # `java -jar` locaux). 8095 aligné sur le port hôte déjà utilisé.
  port: ${SERVER_PORT:8095}

spring:
  application:
    name: service-adm
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fretcorridor}
    username: ${SPRING_DATASOURCE_USERNAME:fretcorridor}
    password: ${SPRING_DATASOURCE_PASSWORD:fretcorridor}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health
