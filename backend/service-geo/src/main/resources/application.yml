# Configuration par defaut : utilisee en run local (hors Docker), profil actif = "default".
server:
  port: 8084

spring:
  application:
    name: service-geo
  datasource:
    # Port 5434 : port expose cote hote par docker-compose.yml (mapping "5434:5432").
    # En profil "docker" (cf application-docker.yml), cette URL est remplacee par
    # jdbc:postgresql://postgres:5432/... (nom de service Compose, port interne).
    url: jdbc:postgresql://localhost:5434/fretcorridor
    username: fretcorridor
    password: ${DB_PASSWORD:fretcorridor}
  jpa:
    hibernate:
      # Garde-fou anti-derive : le schema est TOUJOURS pilote par Flyway (migrations versionnees),
      # jamais par Hibernate auto-ddl. "validate" fait juste echouer le demarrage si le schema
      # reel ne correspond pas a ce que JPA attend - aucune modification automatique en base.
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.spatial.dialect.postgis.PostgisPG95Dialect
  flyway:
    enabled: true
    schemas: geo
    default-schema: geo

# Meme secret que service-ida/service-mkt - obligatoire pour valider les JWT
# emis par service-ida (identite centralisee). Fallback variable d'environnement
# (FRETCORRIDOR_JWT_SECRET) pour permettre la surcharge en Docker/prod sans
# jamais forcer un changement de code (ENF-SEC-05, secrets jamais en dur dans
# le code - la valeur par defaut ci-dessous reste "dev uniquement", comme
# documente cote service-mkt).
fretcorridor:
  jwt:
    secret: ${FRETCORRIDOR_JWT_SECRET:fretcorridor-v4-secret-dev-uniquement-a-changer-en-prod-CHANGE_ME}

logging:
  level:
    com.fretcorridor.geo: DEBUG
