server:
  port: 8087

spring:
  application:
    name: service-trk
  datasource:
    url: jdbc:postgresql://localhost:5434/fretcorridor
    username: fretcorridor
    password: ${DB_PASSWORD:fretcorridor}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    schemas: trk
    default-schema: trk
  client:
    service-opt:
      base-url: http://localhost:8085
      # Timeouts stricts, meme principe que GEO/MAT cote OPT (ENF-DIS-04) :
      # si OPT ne repond pas vite, TRK ne doit jamais rester bloque - au pire
      # pas d'ETA ce tour, l'ingestion de position continue normalement.
      connect-timeout-ms: 200
      read-timeout-ms: 300
  kafka:
    # PLAINTEXT_HOST (localhost:9092) - profil par defaut = run hors Docker.
    bootstrap-servers: localhost:9092

    # --- Consumer (PositionBrute entrant depuis service-flt) ---
    consumer:
      group-id: service-trk
      # earliest : coherent avec EF-TRK-01 (ingestion tolerante a la connectivite).
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        # Producteur non-Spring (service-flt) : pas d'en-tete __TypeId__.
        spring.json.value.default.type: com.fretcorridor.trk.messaging.PositionBruteEvent
        spring.json.use.type.headers: false
        spring.json.trusted.packages: com.fretcorridor.trk.messaging

    # --- Producer (PositionETA → service-exe, AlerteEcart → service-not) ---
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # Idempotence producteur Kafka : éviter les doublons en cas de retry
        # (ENF-SEC-03, couplé avec un eventId unique côté applicatif).
        enable.idempotence: true
        acks: all
        retries: 3

# Meme secret que service-ida/service-mkt/service-geo - obligatoire pour
# valider les JWT emis par service-ida (identite centralisee). Fallback
# variable d'environnement (FRETCORRIDOR_JWT_SECRET) pour la surcharge en
# Docker/prod (ENF-SEC-05, secrets jamais en dur - valeur par defaut "dev
# uniquement", documentee cote service-mkt).
fretcorridor:
  jwt:
    secret: ${FRETCORRIDOR_JWT_SECRET:fretcorridor-v4-secret-dev-uniquement-a-changer-en-prod-CHANGE_ME}
  # BUG CORRIGE (audit de suivi, 23 aout) : ServiceOptClient appelle desormais
  # GET /api/opt/affectations/{missionId} avec cette cle (meme valeur partagee
  # que les autres appels interservices, cf service-opt/service-mat).
  internal:
    service-key: ${FRETCORRIDOR_INTERNAL_SERVICE_KEY:fretcorridor-v4-cle-interne-dev-uniquement-a-changer-en-prod-CHANGE_ME}
  # FIX audit 21/08 (anti-patron CDC S12.4) : seuils de detection d'anomalies
  # externalises (AnomalieDetector) - ajustables par deploiement sans
  # recompilation. Defauts : arret <0.1 km sur 30 min ; absence >2 h ;
  # ecart corridor >35 km en 15 min (=140 km/h soutenus, au-dessus de tout
  # roulage legal - l'ancien defaut 50 km exigeait ~200 km/h et ne pouvait
  # jamais declencher) ; saut aberrant >50 km entre 2 positions.
  trk:
    seuil-distance-arret-km: 0.1
    seuil-duree-arret-minutes: 30
    seuil-absence-position-heures: 2
    seuil-ecart-corridor-km: 35
    fenetre-ecart-corridor-minutes: 15
    seuil-saut-aberrant-km: 50

logging:
  level:
    com.fretcorridor.trk: DEBUG
