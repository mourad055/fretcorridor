server:
  port: 8081

spring:
  application:
    name: service-ida
  sql:
    init:
      mode: always
  datasource:
    url: jdbc:postgresql://localhost:5434/fretcorridor
    username: fretcorridor
    password: fretcorridor
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: service_ida
        # Sans ce flag, Hibernate 6 tente de créer les tables du schéma
        # service_ida avant que le schéma lui-même n'existe sur une base
        # neuve ("schema does not exist") — premier démarrage toujours en
        # échec sinon, contournable seulement par un second essai manuel.
        hbm2ddl.create_namespaces: true
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

fretcorridor:
  jwt:
    secret: ${FRETCORRIDOR_JWT_SECRET:fretcorridor-v4-secret-dev-uniquement-a-changer-en-prod-CHANGE_ME}
    expiration-access-ms: 86400000    # 24h
    expiration-refresh-ms: 2592000000 # 30 jours

# MinIO — dépôt de pièces justificatives KYC (EF-IDA-03)
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ROOT_USER:fretcorridor}
  secret-key: ${MINIO_ROOT_PASSWORD:fretcorridor-secret}
  bucket: ${MINIO_BUCKET:fretcorridor-kyc}
  presign-expiry-minutes: ${MINIO_PRESIGN_EXPIRY_MINUTES:15}

logging:
  level:
    com.flysoft.fretcorridor: DEBUG
