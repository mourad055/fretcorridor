server:
  port: 8096

spring:
  application:
    name: service-cap
  datasource:
    url: jdbc:postgresql://localhost:5434/fretcorridor
    username: fretcorridor
    password: fretcorridor
  jpa:
    hibernate:
      # Garde-fou anti-derive, identique aux autres services : le schema est
      # TOUJOURS pilote par Flyway, jamais par Hibernate auto-ddl.
      ddl-auto: validate
  flyway:
    enabled: true
    schemas: cap
    default-schema: cap
  client:
    service-flt:
      base-url: http://localhost:8092
      # Best-effort (ENF-DIS-04) : service-cap ne doit jamais rester bloque
      # pour resoudre un transporteur. Marge allongee (etait 200/300ms) suite
      # au test Docker reel du 18 aout : le tout premier appel apres un
      # docker-compose up echouait systematiquement en timeout, pool de
      # connexions pas encore chaud.
      connect-timeout-ms: 500
      read-timeout-ms: 1000
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        acks: all
        retries: 3

# EF-CAP-08 : coefficient de conversion volumetrique pour la regle du maximum
# (poids taxable = max(poids reel, volume x coefficient)). 333 kg/m3 est un
# ratio courant en fret routier (1 m3 "pese" au moins 333 kg pour la
# facturation) - PLACEHOLDER a valider avec le metier, jamais code en dur
# dans le service lui-meme (lu depuis cette config).
fretcorridor:
  cap:
    coefficient-volumetrique-kg-par-m3: 333.0
  # Meme secret que service-ida/service-mkt/service-geo/... - obligatoire
  # pour valider les JWT emis par service-ida (identite centralisee).
  # Fallback variable d'environnement pour la surcharge en Docker/prod
  # (ENF-SEC-05, jamais en dur dans le code).
  jwt:
    secret: ${FRETCORRIDOR_JWT_SECRET:fretcorridor-v4-secret-dev-uniquement-a-changer-en-prod-CHANGE_ME}

logging:
  level:
    com.flysoft.fretcorridor.cap: DEBUG
