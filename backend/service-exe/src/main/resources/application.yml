server:
  port: 8093

spring:
  application:
    name: service-exe
  sql:
    init:
      mode: always
  datasource:
    url: jdbc:postgresql://localhost:5434/fretcorridor
    username: fretcorridor
    password: fretcorridor
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: service_exe
    open-in-view: false
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# MinIO — preuves d'enlèvement/livraison (RG-070/072, EF-EXE-03/05)
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ROOT_USER:fretcorridor}
  secret-key: ${MINIO_ROOT_PASSWORD:fretcorridor-secret}
  bucket: ${MINIO_BUCKET_PREUVES:fretcorridor-preuves}

fretcorridor:
  jwt:
    secret: fretcorridor-v4-secret-dev-uniquement-a-changer-en-prod-CHANGE_ME
  exe:
    # Phase 1 mono-tenant assumé (même raisonnement que l'ADR 0011, GEO ; même
    # valeur que service-bur) : AffectationConfirmee ne porte pas de tenant,
    # on le stampe ici à l'ingestion. À remplacer par une vraie résolution
    # axe->tenant en Phase 3.
    tenant-id-phase1: ${FRETCORRIDOR_EXE_TENANT_ID_PHASE1:tenant-bgft-douala}

logging:
  level:
    com.flysoft.fretcorridor: DEBUG
