# Bloc Docker Compose du service-flt (Mobile).
# Ne contient PAS l'infra partagee (Postgres, Kafka...) : ce fichier s'empile
# TOUJOURS sur infra/docker-compose.yml, jamais utilisable seul.
services:
  service-flt:
    build:
      context: ../backend/service-flt
    container_name: fretcorridor-service-flt
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 3
      # Manquait — le producteur Kafka restait sur localhost:9092 (invalide
      # en reseau Docker), bloquant ~60s chaque POST /positions et tuant le
      # pipeline position-brute → service-trk → position-eta → service-bur
      # (suivi temps reel du portail Bureau sur :8099).
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8092:8083"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
