server:
  port: 8083

spring:
  application:
    name: service-flt
  sql:
    init:
      mode: always
  datasource:
    url: jdbc:postgresql://localhost:5434/fretcorridor
    username: fretcorridor
    password: fretcorridor
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: service_flt
    open-in-view: false
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  client:
    service-exe:
      base-url: http://localhost:8093
      # Best-effort (ENF-DIS-04) : l'ingestion d'une position ne doit jamais
      # rester bloquee pour resoudre le vehicule affecte.
      connect-timeout-ms: 500
      read-timeout-ms: 1000

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ROOT_USER:fretcorridor}
  secret-key: ${MINIO_ROOT_PASSWORD:fretcorridor-secret}
  bucket: ${MINIO_BUCKET_VEHICULES:fretcorridor-vehicules}

fretcorridor:
  jwt:
    secret: ${FRETCORRIDOR_JWT_SECRET:fretcorridor-v4-secret-dev-uniquement-a-changer-en-prod-CHANGE_ME}
  internal:
    # Meme cle que service-cap/service-not (fretcorridor.internal.service-key)
    # -- permet a service-not de resoudre le proprietaire d'un vehicule pour
    # une AlerteEcart sans JWT utilisateur (declenche par Kafka, aucun tenant
    # particulier a filtrer), meme principe que GET /api/cap/capacites/{id}.
    service-key: ${FRETCORRIDOR_INTERNAL_SERVICE_KEY:fretcorridor-v4-cle-interne-dev-uniquement-a-changer-en-prod-CHANGE_ME}

logging:
  level:
    com.flysoft.fretcorridor: DEBUG
