# Bloc Docker Compose du service-not (Mobile).
# Ne contient PAS l'infra partagee (Postgres, Kafka...) : ce fichier s'empile
# TOUJOURS sur infra/docker-compose.yml, jamais utilisable seul.
services:
  service-not:
    build:
      context: ../backend/service-not
    container_name: fretcorridor-service-not
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8094:8094"
    depends_on:
      postgres:
        condition: service_healthy
