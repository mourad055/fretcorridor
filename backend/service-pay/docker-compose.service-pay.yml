# Toujours exécuté depuis la racine du repo (le contexte de build est
# relatif à backend/service-pay/). Toujours combiné avec
# infra/docker-compose.yml (dépend de son service `postgres`).
# est indispensable : sinon Docker Compose résout le contexte de build
# relatif au répertoire du premier -f (infra/), pas à ce fichier.
#   docker compose -f infra/docker-compose.yml -f backend/service-pay/docker-compose.service-pay.yml up -d
# Ne jamais fusionner ce bloc dans infra/docker-compose.yml — voir
# docs/adr/0006, addendum Sprint 13.

services:
  service-pay:
    build:
      context: ../backend/service-pay
    container_name: fretcorridor-service-pay
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # "dev" par defaut : active data-dev.sql (ecritures/sequestres de
      # demonstration) - c'est ce profil que consomme le conteneur de demo
      # Web. Surchargeable pour un environnement sans donnees de demo.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fretcorridor
      SPRING_DATASOURCE_USERNAME: fretcorridor
      SPRING_DATASOURCE_PASSWORD: fretcorridor
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 3
    ports:
      - "8088:8088"
