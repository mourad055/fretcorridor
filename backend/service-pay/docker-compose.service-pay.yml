# Toujours exécuté depuis la racine du repo (le contexte de build est
# relatif à backend/service-pay/). Toujours combiné avec
# infra/docker-compose.yml (dépend de son service `postgres`). --project-directory .
# est indispensable : sinon Docker Compose résout le contexte de build
# relatif au répertoire du premier -f (infra/), pas à ce fichier.
#   docker compose --project-directory . -f infra/docker-compose.yml -f backend/service-pay/docker-compose.service-pay.yml up -d
# Ne jamais fusionner ce bloc dans infra/docker-compose.yml — voir
# docs/adr/0006, addendum Sprint 13.

services:
  service-pay:
    build:
      context: backend/service-pay
    container_name: fretcorridor-service-pay
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fretcorridor
      SPRING_DATASOURCE_USERNAME: fretcorridor
      SPRING_DATASOURCE_PASSWORD: fretcorridor
    ports:
      - "8084:8084"
