# Toujours exécuté depuis la racine du repo (le contexte de build est
# relatif à backend/service-bur/). Toujours combiné avec
# infra/docker-compose.yml (dépend de son service `postgres`).
# est indispensable : sinon Docker Compose résout le contexte de build
# relatif au répertoire du premier -f (infra/), pas à ce fichier.
#   docker compose -f infra/docker-compose.yml -f backend/service-bur/docker-compose.service-bur.yml up -d
# Ne jamais fusionner ce bloc dans infra/docker-compose.yml — voir
# docs/adr/0006, addendum Sprint 13.

services:
  service-bur:
    build:
      context: ../backend/service-bur
    container_name: fretcorridor-service-bur
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # "dev" par defaut : active data-dev.sql (missions/positions de
      # demonstration) - c'est ce profil que consomme le conteneur de demo
      # Web. Surchargeable pour un environnement sans donnees de demo.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fretcorridor
      SPRING_DATASOURCE_USERNAME: fretcorridor
      SPRING_DATASOURCE_PASSWORD: fretcorridor
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 3
      # Manquait - service-bur tournait avec le defaut localhost:9092
      # (invalide en reseau Docker), boucle de reconnexion infinie sur
      # les 2 consumers Kafka. kafka:29092 = listener interne du reseau
      # Docker (cf infra/docker-compose.yml, KAFKA_ADVERTISED_LISTENERS).
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8083:8083"
