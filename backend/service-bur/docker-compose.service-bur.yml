# "../backend/service-bur", PAS "backend/service-bur" : Docker Compose
# résout les chemins relatifs de build par rapport au répertoire du PREMIER
# fichier -f de la commande (infra/docker-compose.yml, toujours empilé en
# premier), jamais par rapport à l'emplacement de CE fichier. NE PAS passer
# --project-directory : ça casserait cette résolution (vérifié empiriquement,
# cf. ADR 0006). Toujours combiné avec infra/docker-compose.yml (dépend de
# son service `postgres`).
#   docker compose -f infra/docker-compose.yml -f backend/service-bur/docker-compose.service-bur.yml up -d
# Ne jamais fusionner ce bloc dans infra/docker-compose.yml — voir
# docs/adr/0006, addendum Sprint 13.

services:
  service-bur:
    build:
      context: ../backend/service-bur
    container_name: fretcorridor-service-bur
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fretcorridor
      SPRING_DATASOURCE_USERNAME: fretcorridor
      SPRING_DATASOURCE_PASSWORD: fretcorridor
    ports:
      - "8083:8083"
