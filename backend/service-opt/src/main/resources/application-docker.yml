# Profil actif uniquement quand SPRING_PROFILES_ACTIVE=docker (cf infra/docker-compose.yml).
spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/fretcorridor
  client:
    service-geo:
      base-url: http://service-geo:8084
      connect-timeout-ms: 200
      read-timeout-ms: 300
    service-mat:
      base-url: http://service-mat:8086
      connect-timeout-ms: 200
      read-timeout-ms: 300
    valhalla:
      base-url: http://valhalla:8002
      # Contrairement a service-mat (meme porteur, latence ~ms), Valhalla est
      # une dependance reseau externe - on garde le defaut Java (2000ms,
      # cf ValhallaClientProperties) plutot que le timeout serre des appels
      # internes. Ne pas copier les valeurs de service-mat ici.
      connect-timeout-ms: 500
