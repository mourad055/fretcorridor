# Configuration par defaut : run local hors Docker, profil actif = "default".
server:
  port: 8085
spring:
  application:
    name: service-opt
  datasource:
    url: jdbc:postgresql://localhost:5434/fretcorridor
    username: fretcorridor
    password: fretcorridor
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    schemas: opt
    default-schema: opt
  client:
    service-geo:
      base-url: http://localhost:8084
      # Timeouts stricts et explicites (jamais de valeur par defaut implicite) :
      # coherent avec le budget L0 ~50ms - si GEO ne repond pas vite, OPT ne doit
      # jamais rester bloque indefiniment (cf ENF-DIS-04, degradation gracieuse).
      connect-timeout-ms: 200
      read-timeout-ms: 300
    service-mat:
      base-url: http://localhost:8086
      connect-timeout-ms: 200
      read-timeout-ms: 300
    valhalla:
      base-url: http://localhost:8002
      # Contrairement a service-mat (meme porteur, latence ~ms), Valhalla est
      # une dependance reseau externe - on garde le defaut Java (2000ms,
      # cf ValhallaClientProperties) plutot que le timeout serre des appels
      # internes. Ne pas copier les valeurs de service-mat ici.
      connect-timeout-ms: 500
logging:
  level:
    com.fretcorridor.opt: DEBUG
