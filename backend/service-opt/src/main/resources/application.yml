# Configuration par defaut : run local hors Docker, profil actif = "default".
server:
  port: 8085
spring:
  application:
    name: service-opt
  datasource:
    url: jdbc:postgresql://localhost:5434/fretcorridor
    username: fretcorridor
    password: ${DB_PASSWORD:fretcorridor}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    schemas: opt
    default-schema: opt
  client:
    service-geo:
      base-url: http://localhost:8084
      connect-timeout-ms: 20
      read-timeout-ms: 50
    service-mat:
      base-url: http://localhost:8086
      connect-timeout-ms: 200
      read-timeout-ms: 1000
    service-cap:
      base-url: http://localhost:8096
      connect-timeout-ms: 200
      read-timeout-ms: 300
    valhalla:
      base-url: http://localhost:8002
      connect-timeout-ms: 500
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        acks: all
        retries: 3
# Meme secret que service-ida/service-mkt/service-geo - obligatoire pour
# valider les JWT emis par service-ida (identite centralisee). Fallback
# variable d'environnement (FRETCORRIDOR_JWT_SECRET) pour la surcharge en
# Docker/prod (ENF-SEC-05, secrets jamais en dur - valeur par defaut "dev
# uniquement", documentee cote service-mkt).
fretcorridor:
  jwt:
    secret: ${FRETCORRIDOR_JWT_SECRET:fretcorridor-v4-secret-dev-uniquement-a-changer-en-prod-CHANGE_ME}
  # FIX audit 21/08 : cle interne partagee pour les appels service-a-service
  # sans JWT utilisateur (X-Internal-Service-Key). Meme valeur que celle
  # configuree chez le partenaire (mat<->opt), meme pattern que cap<->not
  # (PR #125).
  internal:
    service-key: ${FRETCORRIDOR_INTERNAL_SERVICE_KEY:fretcorridor-v4-cle-interne-dev-uniquement-a-changer-en-prod-CHANGE_ME}
  # RG-105 (fenetre adaptative) : la duree de la fenetre de traitement est
  # un PARAMETRE D'AXE ("fenetreTraitementSecondes" dans Axe.parametres,
  # EF-GEO-02) - ces proprietes ne sont que les filets globaux : defaut
  # quand l'axe ne definit rien (0 = comportement historique, matching des
  # qu'un lot est formable), bornes de l'adaptation et facteur multiplicatif
  # applique selon le volume observe (lot d'un element -> fenetre x facteur,
  # lot riche -> fenetre / facteur). Borne max 3600 s = "jusqu'a un cycle
  # horaire sur un axe peu dense" (CDC S8.5.2).
  opt:
    matching:
      fenetre-defaut-secondes: 0
      fenetre-min-secondes: 0
      fenetre-max-secondes: 3600
      facteur-adaptation-fenetre: 2.0
      # Filtrage L0 par cellules H3 (CDC S8.5.4) : anneaux de voisines autour
      # de la cellule de l'origine (plafond 3 cote GEO). Repli automatique sur
      # le rayon Haversine si service-geo est injoignable.
      l0-k-ring: 1
      # VALEUR_RETOUR (7e terme CDC S8.5.3) : rayon de recherche du fret au
      # retour autour de la destination, et nb de demandes proches saturant
      # le score a 1.0 (hypotheses d'equipe, calibrables en exploitation).
      valeur-retour-rayon-km: 50
      valeur-retour-saturation: 5

logging:
  level:
    com.fretcorridor.opt: DEBUG
