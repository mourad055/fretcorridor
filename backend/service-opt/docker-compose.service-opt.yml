# Bloc Docker Compose du service-opt (Moteur — OPT : L0-L4, Valhalla, Tarification)
# ET de Valhalla lui-meme, colocalise ici plutot que dans l'infra partagee :
# Valhalla n'est consomme QUE par service-opt (aucun autre service n'y touche),
# donc son cycle de vie suit celui d'OPT, pas celui de l'infra transverse
# (Postgres/Kafka/Redis/MinIO sont, eux, consommes par plusieurs services).
services:
  # Service d'itineraires (calcul de trajet, ETA) consomme par service-opt.
  # Extrapolation d'equipe : le CDC v4.0 ne fixe pas de budget de latence
  # propre a Valhalla (le tableau L0-L4 du S8.10 couvre le moteur, pas ce
  # service tiers) - assimile au budget L3 par choix d'equipe, documente
  # dans docs/adr/0004-valhalla-image-digest.md.
  valhalla:
    # Epingle par digest plutot que ':latest' (CDC S8.10 : reproductibilite
    # des executions). L'image officielle ne publie aucun tag semver (pas de
    # '3.7.0' Docker) - le 3.7.0 du CDC S8.11.2/S8.14 designe la version du
    # LOGICIEL Valhalla (release Git 2026-04-28), pas un tag d'image existant.
    # Digest capture le 2026-08-04, cf docs/adr/0004-valhalla-image-digest.md.
    image: ghcr.io/valhalla/valhalla-scripted@sha256:e454d110227a83804785ff271628d36548388777939f5e18a887ee1bc3f0ffef
    container_name: fretcorridor-valhalla
    restart: unless-stopped
    environment:
      tile_urls: https://download.geofabrik.de/africa/cameroon-latest.osm.pbf
      use_tiles_ignore_pbf: "True"
      force_rebuild: "False"
    ports:
      - "8002:8002"
    volumes:
      - valhalla-data:/custom_files
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  service-opt:
    build:
      context: ../backend
      dockerfile: service-opt/Dockerfile
    container_name: fretcorridor-service-opt
    restart: unless-stopped
    environment:
      # docker = URLs internes ; dev = seed barèmes (data-dev.sql), même
      # pattern que service-geo / service-ida. Sans le profil dev, L4 n'a
      # aucun barème actif et publie des propositions à prix null.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker,dev}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 3
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      # Pas de "condition: service_healthy" ici : conforme a ENF-DIS-04,
      # OPT ne doit jamais rester bloque si Valhalla est indisponible ou
      # encore en train de construire son graphe (degradation gracieuse
      # cote ValhallaClient, retourne null, ne bloque jamais OPT).
      valhalla:
        condition: service_started

volumes:
  valhalla-data:
