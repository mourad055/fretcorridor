# Toujours exécuté depuis la racine du repo (le contexte de build est
# relatif à backend/gateway/). Composable avec infra/docker-compose.yml et,
# si besoin d'appels réels service-pay/service-adm plutôt que localhost,
# avec leurs propres fichiers. --project-directory . est indispensable :
# sinon Docker Compose résout le contexte de build relatif au répertoire du
# premier -f (infra/), pas à ce fichier.
#   docker compose --project-directory . -f infra/docker-compose.yml \
#     -f backend/gateway/docker-compose.gateway.yml \
#     -f backend/service-pay/docker-compose.service-pay.yml \
#     -f backend/service-adm/docker-compose.service-adm.yml up -d
# Ne jamais fusionner ce bloc dans infra/docker-compose.yml — voir
# docs/adr/0006, addendum Sprint 13.

services:
  gateway:
    build:
      context: backend/gateway
    container_name: fretcorridor-gateway
    environment:
      # Résolvent par nom de conteneur uniquement si les fichiers compose de
      # service-pay/service-adm sont inclus dans la même commande ; sinon
      # ces variables sont simplement ignorées par les endpoints qui n'y font
      # pas appel dans le scénario testé.
      FRETCORRIDOR_SERVICE_PAY_URL: http://service-pay:8084
      FRETCORRIDOR_SERVICE_ADM_URL: http://service-adm:8085
    ports:
      - "8082:8082"
