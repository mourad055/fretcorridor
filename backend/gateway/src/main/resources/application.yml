server:
  # 8082 : le 8080 standard est déjà occupé par un autre service sur cette
  # machine de développement partagée (cf. docs/adr/0006). Surchargeable via
  # SERVER_PORT en environnement d'intégration/production.
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes: []
      # Aucune route déclarative Spring Cloud Gateway : ce gateway expose ses
      # propres contrôleurs REST (JWT/RBAC, agrégation par port hexagonal),
      # pas un proxy — cf. docs/ANALYSE_FUSION_dev_web-socle.md §6.2.

fretcorridor:
  jwt:
    secret: ${FRETCORRIDOR_JWT_SECRET:fretcorridor-v4-secret-dev-uniquement-a-changer-en-prod-CHANGE_ME}
    validity-minutes: 60
  internal:
    # UC-MAT-02 (26/08) : necessaire uniquement pour l'entorse temporaire
    # RealPropositionMissionAdapter -> service-opt, cf. commentaire
    # fretcorridor.client.service-opt ci-dessous. Meme cle partagee que tous
    # les autres services (service-cap/mat/not/etc.).
    service-key: ${FRETCORRIDOR_INTERNAL_SERVICE_KEY:fretcorridor-v4-cle-interne-dev-uniquement-a-changer-en-prod-CHANGE_ME}
    # ^ utilise par RealPropositionMissionAdapter (fretcorridor.service-opt.base-url ci-dessous)
  service-pay:
    # service-pay est réellement implémenté (contrairement aux autres services
    # de ce périmètre) — appel HTTP réel, pas un mock (cf. docs/adr).
    base-url: ${FRETCORRIDOR_SERVICE_PAY_URL:http://localhost:8088}
  service-adm:
    # service-adm est réellement implémenté (Sprint 10) — appel HTTP réel.
    # 8095 (pas 8085 : collision avec le port interne par défaut de service-opt).
    base-url: ${FRETCORRIDOR_SERVICE_ADM_URL:http://localhost:8095}
  service-ida:
    # service-ida (Mobile) est réellement implémenté — appel HTTP réel pour
    # l'authentification (cf. docs/ROADMAP_INTEGRATION_gateway.md, Phase 1).
    base-url: ${FRETCORRIDOR_SERVICE_IDA_URL:http://localhost:8081}
  service-geo:
    # service-geo (Moteur, Sprint 3, @stevetelecom) est réellement implémenté
    # depuis ce jour — RealGeoAdapter remplace MockGeoAdapter.
    base-url: ${FRETCORRIDOR_SERVICE_GEO_URL:http://localhost:8084}
  service-bur:
    # service-bur (Web) matérialise les missions appariées depuis Kafka —
    # ServiceBurMissionAppparieeAdapter remplace MockOptAdapter (jamais
    # d'appel direct à service-opt, cf. docs/ROADMAP_INTEGRATION_gateway.md).
    base-url: ${FRETCORRIDOR_SERVICE_BUR_URL:http://localhost:8083}
  service-flt:
    # service-flt (Mobile) : appel réel pour le registre de véhicules
    # (Sprint 10, VehiculePort/RealVehiculeAdapter) et l'envoi de positions
    # GPS (Sprint 6, PositionPort/RealPositionAdapter) — même service.
    base-url: ${FRETCORRIDOR_SERVICE_FLT_URL:http://localhost:8083}
  service-opt:
    # ENTORSE TEMPORAIRE (UC-MAT-02, 26/08) : shared-contracts/openapi/opt-api.yaml
    # et l'ADR 0013 interdisent explicitement tout appel REST direct
    # cross-porteur vers service-opt (Moteur) -- "le flux OPT -> Mobile passe
    # exclusivement par evenements Kafka asynchrones". Ce client viole cette
    # regle pour livrer une demo fonctionnelle de l'acceptation/refus de
    # mission par le chauffeur dans le delai imparti (branche locale,
    # feature/retours-ux-27-08, jamais pousse sur dev). A REGULARISER avant
    # tout merge : migrer vers le patron deja etabli par ADR 0013/0014
    # (service-opt publie un evenement Kafka, un service porteur Mobile --
    # service-exe est le candidat naturel, deja proprietaire de "Mission"
    # cote chauffeur -- le consomme et expose la lecture/les actions en REST)
    # a coordonner avec le porteur Moteur avant integration.
    base-url: ${FRETCORRIDOR_SERVICE_OPT_URL:http://localhost:8085}
  service-cap:
    # service-cap (Mobile) : appel réel pour la déclaration de capacité
    # (CapaciteDeclarationPort/RealCapaciteDeclarationAdapter, Sprint 4) et
    # la lecture web transporteur (CapacitePort/RealCapaciteReadAdapter, FE-TRP-01).
    base-url: ${FRETCORRIDOR_SERVICE_CAP_URL:http://localhost:8096}
  service-exe:
    # service-exe (Mobile) : appel réel pour l'exécution de mission côté
    # chauffeur (MissionExecutionPort/RealMissionExecutionAdapter, Sprint 7)
    # et la chronologie web Bureau/Transporteur (ExePort/RealExeAdapter).
    base-url: ${FRETCORRIDOR_SERVICE_EXE_URL:http://localhost:8093}
  service-not:
    # service-not (Mobile) : appel réel pour le centre de notifications côté
    # chauffeur (NotificationMobilePort/RealNotificationMobileAdapter, Sprint 9).
    base-url: ${FRETCORRIDOR_SERVICE_NOT_URL:http://localhost:8094}

management:
  endpoints:
    web:
      exposure:
        include: health
