server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: service-ida
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**,/api/acteurs/**,/api/kyc/**
        - id: service-mkt
          uri: http://localhost:8082
          predicates:
            - Path=/api/catalogue-emballages/**,/api/demandes/**

      # ⚠️ Squelette S1 — routes ajoutées au fur et à mesure des sprints
      # (service-cap, service-mkt, service-mat/opt, etc.)
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:*"
              - "http://127.0.0.1:*"
              - "http://192.168.*.*:*"
              - "http://10.*.*.*:*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
