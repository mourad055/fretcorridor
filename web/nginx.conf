# Sert le build Angular (SPA : toute route inconnue retombe sur index.html)
# et proxifie /api/ vers le gateway — apiBaseUrl (environment.ts) est
# volontairement relatif ("/api/v1") pour que ce même build fonctionne sans
# modification sur n'importe quelle machine, tant que GATEWAY_HOST pointe
# vers le bon gateway (cf. docker-compose.web.yml).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://${GATEWAY_HOST}:${GATEWAY_PORT}/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
