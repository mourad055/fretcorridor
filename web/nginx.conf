server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Routage SPA Angular : toute route inconnue retombe sur index.html
    # (Angular Router gere le routage cote client).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # apiBaseUrl = '/api/v1' (relatif, environment.ts) : le navigateur appelle
    # ce meme domaine/port, Nginx relaie vers le gateway sur le reseau Docker.
    location /api/ {
        proxy_pass http://gateway:8082/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }
}
