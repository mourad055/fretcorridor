<table class="fc-table" *ngIf="paiements.length > 0">
  <thead>
    <tr>
      <th>Mission</th>
      <th>Montant</th>
      <th>Date</th>
      <th>Protection</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let paiement of paiementsAffiches">
      <td>{{ paiement.missionId }}</td>
      <td>{{ paiement.montant }}</td>
      <td>{{ paiement.declareeLe | date: 'short' }}</td>
      <td><app-status-badge label="Aucune protection" variant="warning" /></td>
    </tr>
  </tbody>
</table>
<app-pagination [page]="page()" [total]="paiements.length" [taillePage]="taillePage" (pageChange)="page.set($event)" />
<div class="fc-empty" *ngIf="paiements.length === 0">Aucun paiement en espèces.</div>
