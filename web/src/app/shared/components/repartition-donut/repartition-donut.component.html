<div class="repartition-donut" *ngIf="total > 0">
  <svg class="repartition-donut__svg" viewBox="0 0 100 100" role="img" [attr.aria-label]="libelleAccessible">
    <circle class="repartition-donut__fond" cx="50" cy="50" [attr.r]="rayon" />
    <circle
      *ngFor="let s of segmentsCalcules"
      class="repartition-donut__segment"
      cx="50"
      cy="50"
      [attr.r]="rayon"
      [attr.stroke]="s.segment.couleur"
      [attr.stroke-dasharray]="s.dasharray"
      [attr.stroke-dashoffset]="s.dashoffset"
    />
  </svg>

  <ul class="repartition-donut__legende">
    <li *ngFor="let s of segmentsCalcules">
      <span class="repartition-donut__pastille" [style.background]="s.segment.couleur"></span>
      {{ s.segment.label }} — {{ s.segment.valeur }} ({{ s.pourcentage }} %)
    </li>
  </ul>
</div>
