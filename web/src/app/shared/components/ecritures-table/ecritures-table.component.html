<table class="fc-table" *ngIf="ecritures.length > 0">
  <thead>
    <tr>
      <th>Mission</th>
      <th>Nature</th>
      <th>Mode</th>
      <th>Sens</th>
      <th>Montant</th>
      <th>Date</th>
      <th>Statut</th>
      <th><span class="fc-sr-only">Litige</span></th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let ecriture of ecrituresAffichees">
      <td>{{ ecriture.missionId }}</td>
      <td>{{ ecriture.nature }}</td>
      <td>{{ libelleModePaiement(ecriture.modePaiement) }}</td>
      <td>{{ ecriture.sens }}</td>
      <td>{{ ecriture.montant }}</td>
      <td>{{ ecriture.creeLe | date: 'short' }}</td>
      <td><app-status-badge [label]="libelleEcritureStatut(ecriture.statut) | translate" [variant]="ecritureStatusVariant(ecriture.statut)" /></td>
      <td>
        <app-status-badge *ngIf="ecriture.litigeActif" label="Litige — reversement suspendu" variant="danger" />
      </td>
    </tr>
  </tbody>
</table>
<app-pagination [page]="page()" [total]="ecritures.length" [taillePage]="taillePage" (pageChange)="page.set($event)" />
<div class="fc-empty" *ngIf="ecritures.length === 0">Aucune écriture.</div>
