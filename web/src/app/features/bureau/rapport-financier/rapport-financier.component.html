<app-page-shell>
  <section class="rapport-financier fc-panel">
    <h2 class="fc-panel__title">Rapport financier</h2>

    <p class="fc-msg fc-msg--error" role="alert" *ngIf="errorMessage() as message">{{ message }}</p>
    <div class="fc-skeleton" *ngIf="loading()" aria-busy="true">
      <div class="fc-skeleton__line"></div>
      <div class="fc-skeleton__line"></div>
    </div>

    <ng-container *ngIf="!loading()">
      <app-totaux-ecritures [totaux]="totaux()" />
      <div class="fc-actions">
        <button type="button" class="fc-btn fc-btn--ghost" (click)="exporter()" [disabled]="ecritures().length === 0">
          Exporter en CSV
        </button>
      </div>
      <app-ecritures-table [ecritures]="ecritures()" />

      <h3 class="fc-panel__title">Paiements en espèces</h3>
      <app-especes-table [paiements]="paiementsEspeces()" />
    </ng-container>
  </section>
</app-page-shell>
