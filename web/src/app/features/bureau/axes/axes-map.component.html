<main class="axes-map fc-page">
  <header class="fc-page__header">
    <div>
      <h1 class="fc-page__title">Carte des axes</h1>
      <p class="fc-page__subtitle">Axes activés sur votre territoire.</p>
    </div>
  </header>

  <p class="fc-msg fc-msg--error" role="alert" *ngIf="errorMessage() as message">{{ message }}</p>

  <section class="fc-panel">
    <div class="fc-skeleton" *ngIf="loading()" aria-busy="true">
      <div class="fc-skeleton__line"></div>
      <div class="fc-skeleton__line"></div>
    </div>
    <div class="fc-empty" *ngIf="!loading() && axes().length === 0">Aucun axe activé sur votre territoire.</div>

    <app-corridor-map *ngIf="!loading() && axes().length > 0" [axes]="axes()" />

    <table class="fc-table axes-table" *ngIf="!loading() && axes().length > 0">
      <caption>Détail des axes</caption>
      <thead>
        <tr>
          <th>Origine</th>
          <th>Destination</th>
          <th>Distance</th>
          <th>État</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let axe of axes()">
          <td>{{ axe.origine }}</td>
          <td>{{ axe.destination }}</td>
          <td>{{ axe.distanceKm }} km</td>
          <td><app-status-badge [label]="libelleAxeEtat(axe.etatActivation)" [variant]="axeStatusVariant(axe.etatActivation)" /></td>
        </tr>
      </tbody>
    </table>
  </section>
</main>
