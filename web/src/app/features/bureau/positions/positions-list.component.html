<app-page-shell>
  <section class="positions-list fc-panel">
    <h2 class="fc-panel__title">Suivi temps réel</h2>

    <p class="fc-msg fc-msg--error" role="alert" *ngIf="errorMessage() as message">{{ message }}</p>
    <div class="fc-skeleton" *ngIf="loading()" aria-busy="true">
      <div class="fc-skeleton__line"></div>
      <div class="fc-skeleton__line"></div>
    </div>
    <div class="fc-empty" *ngIf="!loading() && positions().length === 0">Aucun véhicule en suivi sur votre territoire.</div>

    <app-positions-map *ngIf="!loading() && positions().length > 0" [positions]="positions()" />

    <table class="fc-table" *ngIf="!loading() && positions().length > 0">
      <thead>
        <tr>
          <th>Véhicule</th>
          <th>Latitude</th>
          <th>Longitude</th>
          <th>Dernière position</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let position of positionsAffiches()">
          <td>{{ position.vehiculeLabel }}</td>
          <td>{{ position.latitude }}</td>
          <td>{{ position.longitude }}</td>
          <td>{{ age(position) }}</td>
        </tr>
      </tbody>
    </table>
    <app-pagination [page]="page()" [total]="positions().length" [taillePage]="taillePage" (pageChange)="page.set($event)" />
  </section>
</app-page-shell>
