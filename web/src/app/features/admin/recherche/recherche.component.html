<app-page-shell>
  <section class="recherche fc-panel">
    <h2 class="fc-panel__title">Recherche globale</h2>
    <p class="fc-page__subtitle">Retrouvez un tenant ou une action du journal d'audit, tous tenants confondus.</p>

    <form class="fc-filters" (ngSubmit)="rechercher()">
      <div class="fc-filters__field">
        <label class="fc-filters__label" for="recherche-terme">Recherche</label>
        <input
          id="recherche-terme"
          type="search"
          class="fc-filters__input"
          placeholder="Identifiant, nom, action, ressource..."
          [ngModel]="terme()"
          (ngModelChange)="terme.set($event)"
          name="terme"
        />
      </div>
      <button type="submit" class="fc-btn fc-btn--primary" [disabled]="loading()">Rechercher</button>
    </form>

    <p class="fc-msg fc-msg--error" role="alert" *ngIf="errorMessage() as message">{{ message }}</p>
    <div class="fc-skeleton" *ngIf="loading()" aria-busy="true">
      <div class="fc-skeleton__line"></div>
      <div class="fc-skeleton__line"></div>
    </div>
    <div class="fc-empty" *ngIf="!loading() && resultats() && resultats()!.length === 0">Aucun résultat.</div>

    <table class="fc-table" *ngIf="!loading() && resultats() && resultats()!.length > 0">
      <thead>
        <tr>
          <th>Type</th>
          <th>Titre</th>
          <th>Détail</th>
          <th>Tenant</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let resultat of resultatsAffiches()">
          <td>{{ libelleType(resultat.type) }}</td>
          <td>{{ resultat.titre }}</td>
          <td>{{ resultat.detail }}</td>
          <td>{{ resultat.tenantId ?? '—' }}</td>
        </tr>
      </tbody>
    </table>
    <app-pagination [page]="page()" [total]="(resultats() ?? []).length" [taillePage]="taillePage" (pageChange)="page.set($event)" />
  </section>
</app-page-shell>
