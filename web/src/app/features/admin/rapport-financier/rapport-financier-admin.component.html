<main class="fc-page fc-page--large">
  <section class="rapport-financier-admin fc-panel">
    <h2 class="fc-panel__title">Rapport financier (consultation transverse)</h2>

    <div class="fc-filters">
      <div class="fc-filters__field">
        <label class="fc-filters__label" for="tenant-select">Tenant</label>
        <select
          id="tenant-select"
          name="tenant"
          class="fc-filters__select"
          [ngModel]="tenantSelectionne()"
          (ngModelChange)="tenantSelectionne.set($event)"
        >
          <option *ngFor="let tenant of tenants" [value]="tenant">{{ tenant }}</option>
        </select>
      </div>
      <button type="button" class="fc-btn fc-btn--primary" (click)="consulter()">Consulter</button>
    </div>

    <p class="fc-msg fc-msg--error" role="alert" *ngIf="errorMessage() as message">{{ message }}</p>

    <ng-container *ngIf="vue$ | async as vue; else chargement">
      <app-totaux-ecritures [totaux]="vue.totaux" />
      <div class="fc-actions">
        <button type="button" class="fc-btn fc-btn--ghost" (click)="exporter(vue.ecritures)" [disabled]="vue.ecritures.length === 0">
          Exporter en CSV
        </button>
      </div>
      <app-ecritures-table [ecritures]="vue.ecritures" />

      <h3 class="fc-panel__title">Paiements en espèces</h3>
      <app-especes-table [paiements]="vue.especes" />
    </ng-container>

    <ng-template #chargement>
      <div class="fc-skeleton" aria-busy="true">
        <div class="fc-skeleton__line"></div>
        <div class="fc-skeleton__line"></div>
      </div>
    </ng-template>
  </section>
</main>
