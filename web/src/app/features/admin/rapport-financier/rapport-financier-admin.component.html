<app-page-shell extraClass="fc-page--large">
  <section class="rapport-financier-admin fc-panel">
    <h2 class="fc-panel__title">Rapport financier (consultation transverse)</h2>

    <div class="fc-filters">
      <div class="fc-filters__field">
        <label class="fc-filters__label" for="tenant-select">Tenant</label>
        <select
          id="tenant-select"
          name="tenant"
          class="fc-filters__select"
          [ngModel]="tenantSelectionne()"
          (ngModelChange)="tenantSelectionne.set($event)"
        >
          <option *ngFor="let tenant of tenants" [value]="tenant">{{ tenant }}</option>
        </select>
      </div>
      <button type="button" class="fc-btn fc-btn--primary" (click)="consulter()" [disabled]="loading()">Consulter</button>
    </div>

    <p class="fc-msg fc-msg--error" role="alert" *ngIf="errorMessage() as message">{{ message }}</p>
    <div class="fc-skeleton" *ngIf="loading()" aria-busy="true">
      <div class="fc-skeleton__line"></div>
      <div class="fc-skeleton__line"></div>
    </div>

    <ng-container *ngIf="!loading() && ecritures() as e">
      <app-totaux-ecritures [totaux]="totaux()" />
      <div class="fc-actions">
        <button type="button" class="fc-btn fc-btn--ghost" (click)="exporter()" [disabled]="e.length === 0">
          Exporter en CSV
        </button>
      </div>
      <app-ecritures-table [ecritures]="e" />

      <h3 class="fc-panel__title">Paiements en espèces</h3>
      <app-especes-table [paiements]="paiementsEspeces()" />
    </ng-container>
  </section>
</app-page-shell>
