<app-page-shell>
  <section class="notifications-internes fc-panel">
    <h2 class="fc-panel__title">Notifications</h2>
    <p class="fc-page__subtitle" *ngIf="!loading() && alertes() as a">
      {{ a.length }} dossier(s) en retard, tous tenants confondus
    </p>

    <p class="fc-msg fc-msg--error" role="alert" *ngIf="errorMessage() as message">{{ message }}</p>
    <div class="fc-skeleton" *ngIf="loading()" aria-busy="true">
      <div class="fc-skeleton__line"></div>
      <div class="fc-skeleton__line"></div>
    </div>
    <div class="fc-empty" *ngIf="!loading() && alertes() && alertes()!.length === 0">
      Aucun dossier en retard pour l'instant.
    </div>

    <ul class="notifications-internes__liste" *ngIf="!loading() && alertes() && alertes()!.length > 0">
      <li *ngFor="let alerte of alertes()">
        <strong>{{ alerte.titre }}</strong>
        <p>{{ alerte.detail }}</p>
        <a [routerLink]="['/admin/dossiers']">Traiter dans la file de travail</a>
      </li>
    </ul>
  </section>
</app-page-shell>
