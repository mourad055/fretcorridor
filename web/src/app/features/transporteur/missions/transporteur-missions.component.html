<app-page-shell>
  <section class="transporteur-missions fc-panel">
    <h2 class="fc-panel__title">Mes missions</h2>

    <p class="fc-msg fc-msg--error" role="alert" *ngIf="errorMessage() as message">{{ message }}</p>
    <div class="fc-skeleton" *ngIf="loading()" aria-busy="true">
      <div class="fc-skeleton__line"></div>
      <div class="fc-skeleton__line"></div>
    </div>
    <div class="fc-empty" *ngIf="!loading() && !errorMessage() && missions().length === 0">Aucune mission pour l'instant.</div>

    <app-mission-chronologie *ngIf="!loading() && missions().length > 0" [missions]="missions()" />
  </section>
</app-page-shell>
