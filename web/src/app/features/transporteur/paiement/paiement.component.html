<main class="fc-page fc-page--large">
  <section class="paiement fc-panel">
    <h2 class="fc-panel__title">Solde &amp; paiement</h2>
    <p class="fc-msg fc-msg--error" role="alert" *ngIf="errorMessage() as message">{{ message }}</p>

    <ng-container *ngIf="solde$ | async as s; else chargement">
      <p class="solde-montant">Solde reçu à ce jour : <strong>{{ s.solde }}</strong></p>
      <app-totaux-ecritures variante="transporteur" [totaux]="s.totaux" />
      <div class="fc-actions">
        <button type="button" class="fc-btn fc-btn--ghost" (click)="exporter(s)" [disabled]="s.historique.length === 0">
          Exporter en CSV
        </button>
      </div>
      <app-ecritures-table [ecritures]="s.historique" />
    </ng-container>

    <ng-template #chargement>
      <div class="fc-skeleton" aria-busy="true">
        <div class="fc-skeleton__line"></div>
        <div class="fc-skeleton__line"></div>
      </div>
    </ng-template>
  </section>
</main>
