<section class="paiement fc-panel">
  <h2 class="fc-panel__title">Solde &amp; paiement</h2>

  <p class="fc-msg fc-msg--error" role="alert" *ngIf="errorMessage() as message">{{ message }}</p>
  <div class="fc-skeleton" *ngIf="loading()" aria-busy="true">
    <div class="fc-skeleton__line"></div>
    <div class="fc-skeleton__line"></div>
  </div>

  <ng-container *ngIf="!loading() && solde() as s">
    <p class="solde-montant">Solde reçu à ce jour : <strong>{{ s.solde }}</strong></p>
    <app-ecritures-table [ecritures]="s.historique" />
  </ng-container>
</section>
