version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: fretcorridor-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fretcorridor"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fretcorridor-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: fretcorridor-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: fretcorridor-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  minio:
    image: minio/minio:latest
    container_name: fretcorridor-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Service d'itineraires (calcul de trajet, ETA) consomme par service-opt.
  # Extrapolation d'equipe : le CDC v4.0 ne fixe pas de budget de latence
  # propre a Valhalla (le tableau L0-L4 du S8.10 couvre le moteur, pas ce
  # service tiers) - on l'assimile au budget L3 par choix d'equipe, a
  # documenter dans docs/adr/.
  valhalla:
    # Epingle par digest plutot que ':latest' (CDC S8.10 : reproductibilite
    # des executions). L'image officielle ne publie aucun tag semver (pas de
    # '3.7.0' Docker) - le 3.7.0 du CDC S8.11.2/S8.14 designe la version du
    # LOGICIEL Valhalla (release Git 2026-04-28), pas un tag d'image existant.
    # Digest capture le 2026-08-04, cf docs/adr/0004-valhalla-image-digest.md.
    image: ghcr.io/valhalla/valhalla-scripted@sha256:e454d110227a83804785ff271628d36548388777939f5e18a887ee1bc3f0ffef
    container_name: fretcorridor-valhalla
    environment:
      tile_urls: https://download.geofabrik.de/africa/cameroon-260803.osm.pbf
      use_tiles_ignore_pbf: "True"
      force_rebuild: "False"
    ports:
      - "8002:8002"
    volumes:
      - valhalla-data:/custom_files
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  service-geo:
    build:
      context: ../backend
      dockerfile: service-geo/Dockerfile
    container_name: fretcorridor-service-geo
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy

  service-opt:
    build:
      context: ../backend
      dockerfile: service-opt/Dockerfile
    container_name: fretcorridor-service-opt
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      # Pas de "condition: service_healthy" ici : conforme a ENF-DIS-04,
      # OPT ne doit jamais rester bloque si Valhalla est indisponible ou
      # encore en train de construire son graphe (degradation gracieuse
      # cote ValhallaClient, retourne null, ne bloque jamais OPT).
      valhalla:
        condition: service_started

  service-ida:
    build:
      context: ../backend/service-ida
    container_name: fretcorridor-service-ida
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8081:8081"

    depends_on:
      postgres:
        condition: service_healthy

  service-mat:
    build:
      context: ../backend
      dockerfile: service-mat/Dockerfile
    container_name: fretcorridor-service-mat
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8086:8086"
    depends_on:
      postgres:
        condition: service_healthy

  service-trk:
    build:
      context: ../backend
      dockerfile: service-trk/Dockerfile
    container_name: fretcorridor-service-trk
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8087:8087"
    depends_on:
      postgres:
        condition: service_healthy
      # Pas de "condition: service_healthy" sur kafka (aucun healthcheck
      # defini dessus dans ce compose) : le consumer Spring Kafka retente la
      # connexion en arriere-plan si le broker n'est pas encore pret au
      # demarrage, sans bloquer ni faire planter service-trk (EF-TRK-01,
      # ingestion tolerante a la connectivite).
      kafka:
        condition: service_started

  gateway:
    build:
      context: ../backend/gateway
    container_name: fretcorridor-gateway
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8088:8080"
    depends_on:
      - service-ida

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: fretcorridor-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "8091:80"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres-data:
  minio-data:
  valhalla-data:
